name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Verify tag matches package.json version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        PKG="v$(node -p "require('./package.json').version")"
        if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
          echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
          exit 1
        fi

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript & data assets
      run: npm run build

    - name: Run automated tests
      run: npm test

    - name: Skip if this version is already on npm
      id: exists
      run: |
        NAME=$(node -p "require('./package.json').name")
        VER=$(node -p "require('./package.json').version")
        if npm view "$NAME@$VER" version >/dev/null 2>&1; then
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "$NAME@$VER is already on npm; skipping publish."
        else
          echo "published=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Check NPM_TOKEN
      if: steps.exists.outputs.published != 'true' || github.event_name == 'workflow_dispatch'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "::error::The NPM_TOKEN repository secret is empty or missing."
          exit 1
        fi
        echo "Token length: ${#NODE_AUTH_TOKEN}, starts with: ${NODE_AUTH_TOKEN:0:4}, has whitespace: $(printf '%s' "$NODE_AUTH_TOKEN" | grep -c '[[:space:]]')"
        echo "Registry: $(npm config get registry)"
        echo "npmrc in use has an authToken line: $(grep -c ':_authToken=' "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo 0)"
        if ! npm whoami; then
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::npm whoami failed: the NPM_TOKEN secret is revoked, expired, mistyped, or lacks permissions."
            exit 1
          fi
          echo "::warning::npm whoami failed; the token may be revoked, expired, or lack permissions."
        fi

    - name: Dry run (manual runs only, nothing is published)
      if: github.event_name == 'workflow_dispatch'
      run: npm publish --access public --dry-run
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Publish to npm
      if: startsWith(github.ref, 'refs/tags/') && steps.exists.outputs.published != 'true'
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
